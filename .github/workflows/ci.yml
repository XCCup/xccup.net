name: XCCup CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      TZ: Europe/Berlin

    steps:
      - name: 👀 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: 🕸 Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: 🙄 Reject focused tests
        shell: bash
        run: |
          if grep -R --line-number -E '(^|[^[:alnum:]_])(describe|it|test)\.only[[:space:]]*\(' client/cypress/e2e server/test; then
            echo "Focused tests must not be committed."
            exit 1
          fi

      - name: 🖥 Install server dependencies
        run: pnpm --dir server install --frozen-lockfile

      - name: 🔍 Lint, typecheck and build server
        run: |
          pnpm --dir server lint
          pnpm --dir server typecheck
          pnpm --dir server build

      - name: 🧪 Test server
        env:
          NODE_ENV: CI
          METAR_API_KEY: ${{ secrets.METAR_API_KEY }}
        run: pnpm --dir server test --runInBand

      - name: 💻 Install client dependencies
        run: pnpm --dir client install --frozen-lockfile

      - name: 🛠 Lint, typecheck and build client
        run: |
          pnpm --dir client lint
          pnpm --dir client typecheck
          pnpm --dir client build-local

      - name: 🐳 Start backend
        working-directory: server
        env:
          METAR_API_KEY: ${{ secrets.METAR_API_KEY }}
        run: docker compose --env-file .env.ci -f docker-compose-ci.yml up -d --build

      - name: 🏃‍♀️ Run Cypress
        uses: cypress-io/github-action@v7
        with:
          install: false
          package-manager-cache: false
          working-directory: client
          start: pnpm run serve
          wait-on: "http://localhost:3000/api, http://localhost:4173"
          wait-on-timeout: 120
          config: baseUrl=http://localhost:4173
          browser: chrome

      - name: 😩 Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: client/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: 📝 Collect backend logs
        if: always()
        working-directory: server
        run: docker compose --env-file .env.ci -f docker-compose-ci.yml logs --no-color > docker-compose.log

      - name: 📤 Upload backend logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-logs
          path: server/docker-compose.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧹 Stop backend
        if: always()
        working-directory: server
        run: docker compose --env-file .env.ci -f docker-compose-ci.yml down --remove-orphans
