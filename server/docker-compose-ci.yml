services:
  db:
    image: postgis/postgis:13-3.1
    container_name: db
    environment:
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_DB=$POSTGRES_DB
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - xccup-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: ci
    image: xccup/server
    container_name: server
    env_file:
      - .env.ci
    environment:
      - SERVER_PORT=$SERVER_PORT
      - NODE_ENV=CI
      - CI=true
      - METAR_API_KEY=${METAR_API_KEY:-}
    ports:
      - "3000:65090"
    networks:
      - xccup-network
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:

networks:
  xccup-network:
    driver: bridge
